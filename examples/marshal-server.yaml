# Marshal ingest API configuration. See docs/ingest-server.md.

store: /var/lib/marshal/ledger.sqlite

# Store instruction hashes but never instruction text, whatever clients send.
hash_only: false

issuers:
  - issuer: https://token.actions.githubusercontent.com
    provider: github
    audience: marshal
    repositories:
      - acme/*            # only repositories in your organization

  - issuer: https://gitlab.acme.example
    provider: gitlab
    audience: marshal
    repositories:
      - platform/agents/*

policy:
  shipped:
    # Who may record shipped and observed events for any environment not listed below.
    refs:
      - refs/heads/main
    protected_refs: false
    protected_environments: true
    # An environment listed here gets only its own rule. Its refs default to none.
    by_environment:
      prod:
        environments:
          - prod          # GitHub environments with required reviewers
        protected_environments: true   # GitLab protected environments

  # Your organization's risk rules, added to Marshal's built-in ratings. Only this
  # file sets them: nothing an agent team sends can change how its changes are rated.
  # See docs/guides/risk-rules.md.
  risk:
    approved_models:
      providers: [anthropic, amazon]
      models: ["anthropic.claude-*", "claude-*", "amazon.nova-*"]
      raise_to: HIGH        # a change to any other model or provider

    rules:
      - name: payments-api
        match:
          targets: ["host:payments.acme.example"]
        raise_to: HIGH
        reason: moves money

      - name: shared-credential-tools
        match:
          identity: [shared_credential]
          categories: [tools]
          kinds: [added]
        raise_to: HIGH
        reason: every user acts with the author's access

      - name: conversation-retention
        match:
          paths: ["extensions.bedrock.idle_session_ttl", "extensions.bedrock-agentcore.memory*"]
        raise_to: MED
        reason: changes how long conversations are kept

      - name: approved-model-upgrades
        match:
          paths: ["model.requested", "model.resolved"]
        lower_to: LOW
        reason: switching between approved models is routine here
