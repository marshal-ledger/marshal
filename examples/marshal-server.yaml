# Marshal ingest API configuration. See docs/ingest-server.md.

store: /var/lib/marshal/ledger.sqlite

# Store instruction hashes but never instruction text, whatever clients send.
hash_only: false

issuers:
  - issuer: https://token.actions.githubusercontent.com
    provider: github
    audience: marshal
    repositories:
      - acme/*            # only repositories in your organization

  - issuer: https://gitlab.acme.example
    provider: gitlab
    audience: marshal
    repositories:
      - platform/agents/*

policy:
  shipped:
    # Who may record shipped and observed events for any environment not listed below.
    refs:
      - refs/heads/main
    protected_refs: false
    protected_environments: true
    # An environment listed here gets only its own rule. Its refs default to none.
    by_environment:
      prod:
        environments:
          - prod          # GitHub environments with required reviewers
        protected_environments: true   # GitLab protected environments
