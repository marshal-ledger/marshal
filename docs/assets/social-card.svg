<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Marshal, an agent ledger">
  <rect width="1280" height="640" fill="#141413"/>
  <rect x="0" y="0" width="1280" height="6" fill="#5b5bd6"/>
  <g transform="translate(88 96) scale(0.27)">
    <rect width="488" height="488" rx="40" fill="#1f1f1e" stroke="#383734" stroke-width="6"/>
    <path fill="#fff" d="M66 377V96h94l84 109 84-109h94v281h-38V132h-35L244 268 139 132h-35v245z"/>
    <rect x="174" y="309" width="140" height="14" fill="#8f8f8f"/>
  </g>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="240" y="160" font-size="64" font-weight="700" fill="#f5f4f2">Marshal</text>
    <text x="240" y="206" font-size="30" fill="#a8a6a1">an agent ledger</text>
    <text x="88" y="330" font-size="44" font-weight="600" fill="#f5f4f2">One versioned record of every AI agent,</text>
    <text x="88" y="386" font-size="44" font-weight="600" fill="#f5f4f2">on every platform.</text>
    <text x="88" y="448" font-size="26" fill="#a8a6a1">Risk-ranked diffs, drift, dependencies and format conversion. Open source.</text>
    <g font-size="21" fill="#c9c7c2">
      <rect x="88" y="502" width="170" height="44" rx="22" fill="none" stroke="#383734" stroke-width="2"/>
      <text x="173" y="531" text-anchor="middle">Copilot Studio</text>
      <rect x="270" y="502" width="146" height="44" rx="22" fill="none" stroke="#383734" stroke-width="2"/>
      <text x="343" y="531" text-anchor="middle">Agentforce</text>
      <rect x="428" y="502" width="120" height="44" rx="22" fill="none" stroke="#383734" stroke-width="2"/>
      <text x="488" y="531" text-anchor="middle">Bedrock</text>
      <rect x="560" y="502" width="146" height="44" rx="22" fill="none" stroke="#383734" stroke-width="2"/>
      <text x="633" y="531" text-anchor="middle">Databricks</text>
      <rect x="718" y="502" width="152" height="44" rx="22" fill="none" stroke="#383734" stroke-width="2"/>
      <text x="794" y="531" text-anchor="middle">Google ADK</text>
      <rect x="882" y="502" width="138" height="44" rx="22" fill="none" stroke="#383734" stroke-width="2"/>
      <text x="951" y="531" text-anchor="middle">LangGraph</text>
      <rect x="1032" y="502" width="160" height="44" rx="22" fill="none" stroke="#383734" stroke-width="2"/>
      <text x="1112" y="531" text-anchor="middle">+ open specs</text>
    </g>
    <text x="1192" y="160" font-size="22" fill="#8c8a85" text-anchor="end">github.com/marshal-ledger/marshal</text>
  </g>
