# Documentation site, published to GitHub Pages by .github/workflows/pages.yml.
# Build locally:
#   pip install --require-hashes -r docs/requirements.txt
#   mkdocs serve
site_name: Marshal
site_description: >-
  Marshal is an open-source, vendor-neutral ledger for enterprise AI agents: one versioned record of every agent
  on Copilot Studio, Agentforce, Bedrock, Databricks, Google ADK and agent code, with risk-ranked diffs, drift and dependencies.
site_url: https://marshal-ledger.github.io/marshal/
repo_url: https://github.com/marshal-ledger/marshal
repo_name: marshal-ledger/marshal
edit_uri: edit/main/docs/
copyright: Marshal is licensed under the Apache License 2.0.

docs_dir: docs
exclude_docs: |
  requirements.*
  overrides/
  assets/demo.tape
  assets/social-card.svg

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/marshal-logo.svg
  favicon: assets/marshal-logo.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Live demo: https://marshal-ledger.github.io/marshal/demo/
  - Concepts:
      - Design: design.md
      - Ledger model: ledger-model.md
      - Conversion and fidelity: conversion.md
      - Portability: portability.md
      - Platform exportability: platform-exportability.md
  - Formats:
      - Databricks Asset Bundles: formats/databricks.md
      - AWS CloudFormation and CDK: formats/cloudformation.md
      - Microsoft Copilot Studio: formats/copilot-studio.md
      - Salesforce Agentforce: formats/agentforce.md
      - Google ADK Agent Config: formats/adk-config.md
      - Vertex AI Agent Engine: formats/vertex-agent-engine.md
      - Python agent code: formats/python.md
      - ADL: formats/adl.md
      - Open Agent Spec: formats/agent-spec.md
      - AGNTCY OASF: formats/oasf.md
      - Marshal file: formats/marshal-file.md
  - Running Marshal:
      - Deployment: deployment.md
      - Ingest API: ingest-server.md
      - GitHub Action: github-action.md
      - Jenkins and Azure DevOps: other-ci.md
      - Azure: azure.md
  - Security review: security-review.md
  - Changelog: https://github.com/marshal-ledger/marshal/blob/main/CHANGELOG.md
