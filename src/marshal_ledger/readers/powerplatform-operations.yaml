         CalendarGetItem, V2CalendarGetItem, V3CalendarGetItem, CalendarGetItems, V2CalendarGetItems,
         V3CalendarGetItems, V4CalendarGetItems, GetMailTips, GetMailTips_V2, GetOutlookCategoryNames,
         GetRoomLists, GetRoomLists_V2, GetRooms, GetRooms_V2, GetRoomsInRoomList, GetRoomsInRoomList_V2]
