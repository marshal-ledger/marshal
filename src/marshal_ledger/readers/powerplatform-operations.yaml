# What Microsoft's standard Power Platform connector operations do, by operation ID.
#
# Copilot Studio actions and topic calls name a connector operation but not its effect.
# For the operations listed here, the reader derives the tool's scope from this table,
# citing the connector reference as the basis. Operations not listed stay unknown.
#
#   read:         returns data and changes nothing (also derived reversible)
#   write:        creates, changes, deletes or sends something
#   irreversible: a write that sends a message, which can't be recalled
#
# Operations whose effect depends on their input, such as HttpRequest or Dataverse's
# PerformBoundAction, are deliberately left out.

shared_office365users:
  source: https://learn.microsoft.com/en-us/connectors/office365users/
  read: [DirectReports, DirectReports_V2, Manager, Manager_V2, MyProfile, MyProfile_V2, MyTrendingDocuments,
         RelevantPeople, TrendingDocuments, UserPhoto, UserPhoto_V2, UserPhotoMetadata, UserProfile,
         UserProfile_V2, SearchUser, SearchUserV2]
  write: [UpdateMyProfile, UpdateMyPhoto]

shared_commondataserviceforapps:
  source: https://learn.microsoft.com/en-us/connectors/commondataserviceforapps/
  read: [ListRecords, ListRecordsWithOrganization, GetItem, GetItemWithOrganization, GetRelevantRows,
         GetEntityFileImageFieldContent, GetEntityFileImageFieldContentWithOrganization]
  write: [CreateRecord, CreateRecordWithOrganization, UpdateOnlyRecord, UpdateOnlyRecordWithOrganization,
          UpdateRecord, UpdateRecordWithOrganization, DeleteRecord, DeleteRecordWithOrganization,
          AssociateEntities, AssociateEntitiesWithOrganization, DisassociateEntities,
          DisassociateEntitiesWithOrganization, UpdateEntityFileImageFieldContent,
          UpdateEntityFileImageFieldContentWithOrganization]

