# The release image. To run an image you built or mirrored, set your registry's repository.
image:
  repository: ghcr.io/marshal-ledger/marshal
  tag: ""          # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# Postgres is required for more than one replica. Use a SQLite store only with
# replicaCount 1 and persistence enabled.
replicaCount: 2

store:
  # A Secret holding the store location, such as postgresql://user:password@host:5432/marshal.
  existingSecret: ""   # required
  secretKey: url

# Rendered into marshal-server.yaml. The store is supplied from the Secret above.
# See docs/ingest-server.md for every setting.
config:
  hash_only: false
  issuers: []
  #  - issuer: https://token.actions.githubusercontent.com
  #    provider: github
  #    audience: marshal
  #    repositories: ["your-org/*"]
  policy:
    shipped:
      refs: ["refs/heads/main"]
      environments: []
  web:
    enabled: true
    user_header: X-Forwarded-Email

serviceAccount:
  # A service account for the pods, for example one annotated for an AKS workload identity
  # (see docs/azure.md). Unset: the namespace's default service account.
  create: false
  name: ""          # defaults to the release name when created; otherwise an existing account
  annotations: {}
  #  azure.workload.identity/client-id: <managed identity client ID>

# Extra labels on the pods, such as azure.workload.identity/use: "true".
podLabels: {}

persistence:
  # For a single-replica SQLite store only.
  enabled: false
  size: 1Gi
  storageClassName: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  # Expose the ingest API to runners, and the web view only through your SSO proxy.
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: marshal.example.com
  #    paths: [{path: /, pathType: Prefix}]
  tls: []

route:
  # An OpenShift Route instead of an Ingress. Expose the web view only through your SSO proxy.
  enabled: false
  host: ""         # assigned by the router when empty
  path: ""
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

networkPolicy:
  # Admit traffic only from the peers listed in `from`, such as the ingress controller's and
  # the SSO proxy's namespaces. The web view trusts the user header from anyone who reaches
  # the pod, so nothing else should.
  enabled: false
  from: []
  #  - namespaceSelector:
  #      matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
  #  - namespaceSelector:
  #      matchLabels: {kubernetes.io/metadata.name: sso-proxy}

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}

# On OpenShift, set runAsUser and fsGroup to "" so the restricted SCC assigns them; an empty
# value leaves the field out. The image runs as any UID with group 0.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

nodeSelector: {}
tolerations: []
affinity: {}
