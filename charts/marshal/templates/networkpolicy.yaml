{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.from }}
{{- fail "networkPolicy.from must name the peers allowed to reach the pod, such as the ingress controller and the SSO proxy" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marshal.fullname" . }}
  labels: {{- include "marshal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "marshal.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - port: http
{{- end }}
