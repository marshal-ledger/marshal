# Values used by CI to lint and render the chart as on AKS with a workload identity: a service
# account annotated with the identity's client ID, the workload identity pod label, and
# Entra ID sign-in to the database.
image: {repository: myregistry.azurecr.io/marshal}
store: {existingSecret: marshal-store}
config:
  store_auth: azure
  issuers:
    - issuer: https://token.actions.githubusercontent.com
      provider: github
      repositories: ["example-org/*"]
serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
podLabels:
  azure.workload.identity/use: "true"
