[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "marshal-ledger"
dynamic = ["version", "readme"]
description = "Marshal — a vendor-neutral, open-source ledger for enterprise AI agents."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marshal contributors" }]
keywords = [
    "ai-agents", "agent-inventory", "agent-registry", "ai-governance", "governance", "audit", "drift-detection",
    "copilot-studio", "agentforce", "bedrock", "bedrock-agents", "terraform", "databricks", "google-adk", "vertex-ai",
    "langgraph", "langchain", "crewai", "openai-agents", "agent-spec", "oasf",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyjwt[crypto]>=2.8",
]
postgres = [
    "psycopg[binary]>=3.1",
]
# Microsoft Entra ID sign-in to Azure Database for PostgreSQL (store_auth: azure).
azure = [
    "azure-identity>=1.13",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "cfn-lint>=1.58",
    "marshal-ledger[server]",
    "marshal-ledger[postgres]",
]

[project.scripts]
marshal = "marshal_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/marshal-ledger/marshal"
Documentation = "https://marshal-ledger.github.io/marshal/"
"Live demo" = "https://marshal-ledger.github.io/marshal/demo/"
Changelog = "https://github.com/marshal-ledger/marshal/blob/main/CHANGELOG.md"
Issues = "https://github.com/marshal-ledger/marshal/issues"

[tool.hatch.version]
path = "src/marshal_ledger/__init__.py"

# The package description is the README, with its relative links and images pointed at the
# repository, since PyPI has no copy of the files they refer to.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/marshal-ledger/marshal/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'srcset="(?!https?://)([^"]+)"'
replacement = 'srcset="https://raw.githubusercontent.com/marshal-ledger/marshal/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/marshal-ledger/marshal/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/marshal_ledger"]

# The source archive carries what building and testing need; the site's images stay in the repository.
[tool.hatch.build.targets.sdist]
exclude = ["docs/assets/*.png", "docs/assets/*.gif", "site/", "tests/fixtures/terraform/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
