[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marshal-ledger"
dynamic = ["version"]
description = "Marshal — a vendor-neutral, open-source ledger for enterprise AI agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marshal contributors" }]
keywords = ["ai-agents", "agent-registry", "governance", "audit", "copilot-studio", "agentforce", "bedrock", "databricks"]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyjwt[crypto]>=2.8",
]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "marshal-ledger[server]",
    "marshal-ledger[postgres]",
]

[project.scripts]
marshal = "marshal_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/marshal-ledger/marshal"
Documentation = "https://github.com/marshal-ledger/marshal/tree/main/docs"
Changelog = "https://github.com/marshal-ledger/marshal/blob/main/CHANGELOG.md"
Issues = "https://github.com/marshal-ledger/marshal/issues"

[tool.hatch.version]
path = "src/marshal_ledger/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/marshal_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
