[build-system]
requires = ["hatchling>=1.32.4", "hatch-fancy-pypi-readme>=25.1.0"]
build-backend = "hatchling.build"

[project]
name = "marshal-ledger"
dynamic = ["version", "readme"]
description = "Marshal — a vendor-neutral, open-source ledger for enterprise AI agents."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marshal contributors" }]
keywords = ["ai-agents", "agent-registry", "governance", "audit", "copilot-studio", "agentforce", "bedrock", "databricks"]
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pyjwt[crypto]>=2.15.1",
]
postgres = [
    "psycopg[binary]>=3.3.6",
]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "marshal-ledger[server]",
    "marshal-ledger[postgres]",
]

[project.scripts]
marshal = "marshal_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/marshal-ledger/marshal"
Documentation = "https://github.com/marshal-ledger/marshal/tree/main/docs"
Changelog = "https://github.com/marshal-ledger/marshal/blob/main/CHANGELOG.md"
Issues = "https://github.com/marshal-ledger/marshal/issues"

[tool.hatch.version]
path = "src/marshal_ledger/__init__.py"

# The package description is the README, with its relative links and images pointed at the
# repository, since PyPI has no copy of the files they refer to.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/marshal-ledger/marshal/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/marshal-ledger/marshal/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/marshal_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
