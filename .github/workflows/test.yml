name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs the tests on the tagged commit

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: marshal-ci
          POSTGRES_DB: marshal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: python scripts/fetch_fixtures.py
      - name: Tests (SQLite)
        run: pytest
      - name: Store tests (Postgres)
        env:
          MARSHAL_TEST_POSTGRES_URL: postgresql://postgres:marshal-ci@localhost:5432/marshal
        run: pytest tests/unit/test_store.py tests/unit/test_freshness.py tests/unit/test_service.py tests/unit/test_server.py tests/unit/test_web.py

  # The oldest versions the declared minimums allow, so they stay honest. The schema test is
  # skipped: older pydantic writes the same schema with different formatting.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"
      - run: pip install --quiet uv
      - run: python scripts/fetch_fixtures.py
      - name: Tests (lowest direct dependencies)
        run: >-
          uv run --isolated --resolution lowest-direct --python 3.10
          --with 'pytest>=8' --with 'httpx>=0.27' --with 'jsonschema>=4.21' --with-editable '.[server,postgres]'
          pytest -q --deselect tests/unit/test_schema.py::test_committed_schema_matches_model

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: Lint and render (Kubernetes defaults, OpenShift with no fixed UID, AKS workload identity)
        run: |
          for values in ci-values.yaml ci-openshift-values.yaml ci-azure-values.yaml; do
            helm lint charts/marshal -f "charts/marshal/$values"
            helm template marshal charts/marshal -f "charts/marshal/$values" > "$RUNNER_TEMP/$values"
          done
      - name: OpenShift values leave the UID and fsGroup to the SCC
        run: |
          if grep -E 'runAsUser|fsGroup' "$RUNNER_TEMP/ci-openshift-values.yaml"; then exit 1; fi
          grep -q 'runAsUser: 10001' "$RUNNER_TEMP/ci-values.yaml"
      - name: Only the AKS values add a service account and pod labels
        run: |
          if grep -E 'kind: ServiceAccount|serviceAccountName|azure.workload.identity' "$RUNNER_TEMP/ci-values.yaml"; then exit 1; fi
          grep -q 'kind: ServiceAccount' "$RUNNER_TEMP/ci-azure-values.yaml"
          grep -q 'serviceAccountName: marshal$' "$RUNNER_TEMP/ci-azure-values.yaml"
          grep -q 'azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000' "$RUNNER_TEMP/ci-azure-values.yaml"
          grep -q 'azure.workload.identity/use: "true"' "$RUNNER_TEMP/ci-azure-values.yaml"
          grep -q 'store_auth: azure' "$RUNNER_TEMP/ci-azure-values.yaml"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t marshal:ci .
      - run: docker run --rm marshal:ci --version
      - name: Includes Entra ID sign-in for the store
        run: docker run --rm --entrypoint python marshal:ci -c "from marshal_ledger.dbauth import AzureTokenProvider; AzureTokenProvider()"
      # As OpenShift runs it: an arbitrary UID in group 0, a read-only root filesystem, no /tmp.
      - name: Runs as an arbitrary UID with a read-only root filesystem
        run: |
          cat > "$RUNNER_TEMP/server.yaml" <<'YAML'
          store: /var/lib/marshal/ledger.sqlite
          issuers: [{issuer: "https://token.actions.githubusercontent.com", provider: github, repositories: ["example-org/*"]}]
          web: {enabled: true}
          YAML
          docker run -d --name marshal --user 123456:0 --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/server.yaml:/etc/marshal/marshal-server.yaml:ro" -v marshal-data:/var/lib/marshal \
            -p 8080:8080 marshal:ci
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs -H 'X-Forwarded-Email: ci@example.com' -o /dev/null http://127.0.0.1:8080/ || { docker logs marshal; exit 1; }
          docker exec marshal test -s /var/lib/marshal/ledger.sqlite

  # Runs the GitHub Action from this checkout against a local ingest server that trusts this
  # repository's OIDC tokens. Pull requests from forks get no OIDC token, so they skip it.
  action:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet '.[server]'
      - run: python scripts/fetch_fixtures.py
      - name: Start an ingest server
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/server.yaml" <<YAML
          store: $RUNNER_TEMP/ledger.sqlite
          issuers:
            - issuer: https://token.actions.githubusercontent.com
              provider: github
              repositories: ["$REPOSITORY"]
          YAML
          marshal serve --config "$RUNNER_TEMP/server.yaml" --port 8080 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - id: collect
        uses: ./collect
        with:
          event: proposed
          artifacts: tests/fixtures/.cache/databricks/agent-langgraph
          target: prod
          url: http://127.0.0.1:8080
          comment: "false"
      - name: The event reached the store
        env:
          REPORT: ${{ steps.collect.outputs.report }}
        run: |
          test -s "$REPORT"
          marshal log agent_langgraph/agent_langgraph --db "$RUNNER_TEMP/ledger.sqlite" | grep proposed
