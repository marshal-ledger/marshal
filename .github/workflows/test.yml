name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: marshal-ci
          POSTGRES_DB: marshal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: python scripts/fetch_fixtures.py
      - name: Tests (SQLite)
        run: pytest
      - name: Store tests (Postgres)
        env:
          MARSHAL_TEST_POSTGRES_URL: postgresql://postgres:marshal-ci@localhost:5432/marshal
        run: pytest tests/unit/test_store.py tests/unit/test_freshness.py tests/unit/test_service.py tests/unit/test_server.py tests/unit/test_web.py

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/marshal -f charts/marshal/ci-values.yaml
      - run: helm template marshal charts/marshal -f charts/marshal/ci-values.yaml > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t marshal:ci .
      - run: docker run --rm marshal:ci --version
