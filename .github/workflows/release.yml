# Publish a release when a version tag such as v0.1.0 is pushed.
#
# Always: checks the tag against every version number and the changelog, runs the tests,
# builds the wheel, sdist and Helm chart, creates a GitHub release with the changelog
# section as notes, and moves the major tag (v0, v1, ...) that workflows use for the
# GitHub Action.
#
# Optional, each off until configured:
# - PyPI: set the repository variable PUBLISH_PYPI to true, add a GitHub environment
#   named pypi, and register this workflow as a trusted publisher for marshal-ledger on PyPI.
# - Container image: set IMAGE_REPOSITORY to ghcr.io/marshal-ledger/marshal, the image the
#   docs and Helm chart use. For a registry other than ghcr.io, also set REGISTRY_USERNAME
#   and the secret REGISTRY_PASSWORD.
#
# See "Releasing" in CONTRIBUTING.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Check versions and changelog
        run: python scripts/release.py check "$GITHUB_REF_NAME"
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    permissions:
      contents: read
      id-token: write   # the Action's end-to-end test
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
      - run: helm package charts/marshal --destination chart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release
          path: |
            dist/
            chart/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* chart/* --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Move the major tag the GitHub Action is used by
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/

  image:
    needs: [check, test]
    if: vars.IMAGE_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # used only when the registry is ghcr.io
      id-token: write   # keyless signing with Sigstore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - id: registry
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: echo "host=${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.IMAGE_REPOSITORY }}:${{ needs.check.outputs.version }}
          sbom: true              # an SPDX software bill of materials, attached to the image
          provenance: mode=max    # SLSA build provenance, attached to the image
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
      - name: Sign the image
        env:
          IMAGE: ${{ vars.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
