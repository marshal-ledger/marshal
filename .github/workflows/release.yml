# Publish a release when a version tag such as v0.1.0 is pushed.
#
# Always: checks the tag against every version number and the changelog, runs the tests,
# builds the wheel, sdist and Helm chart, creates a GitHub release with the changelog
# section as notes, and moves the major tag (v0, v1, ...) that workflows use for the
# GitHub Action.
#
# Optional, each off until configured:
# - PyPI: set the repository variable PUBLISH_PYPI to true, add a GitHub environment
#   named pypi, and register this workflow as a trusted publisher for marshal-ledger on PyPI.
# - Container image: set IMAGE_REPOSITORY to ghcr.io/marshal-ledger/marshal, the image the
#   docs and Helm chart use. For a registry other than ghcr.io, also set REGISTRY_USERNAME
#   and the secret REGISTRY_PASSWORD.
#
# See "Releasing" in CONTRIBUTING.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Check versions and changelog
        run: python scripts/release.py check "$GITHUB_REF_NAME"
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    permissions:
      contents: read
      id-token: write   # the Action's end-to-end test
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - run: helm package charts/marshal --destination chart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: |
            dist/
            chart/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* chart/* --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Move the major tag the GitHub Action is used by
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/

  image:
    needs: [check, test]
    if: vars.IMAGE_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # used only when the registry is ghcr.io
      id-token: write   # keyless signing with Sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: registry
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: echo "host=${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.IMAGE_REPOSITORY }}:${{ needs.check.outputs.version }}
          sbom: true              # an SPDX software bill of materials, attached to the image
          provenance: mode=max    # SLSA build provenance, attached to the image
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v2.6.5   # cosign 2 signatures, which admission controllers and older verifiers read
      - name: Sign the image
        env:
          IMAGE: ${{ vars.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
