# Weekly, grouped updates for the Actions this repository and the collect Action use,
# the Python dependencies and the container base image. Actions are pinned to commit
# SHAs; Dependabot updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/collect"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Marshal is installed into existing environments, so its minimum versions stay as low as
  # it works with; the "lowest" CI job tests them. Dependabot raises a minimum only when the
  # current one excludes a release, or for a security fix.
  - package-ecosystem: pip
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
